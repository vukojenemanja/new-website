meta_title: Nemanja Vukoje - Heiler, Coach & Kundalini-Yoga-Lehrer
meta_desc: Löse emotionale Blockaden, verbinde dich wieder mit deiner Energie und finde zurück in ein Leben, das sich wirklich lebendig anfühlt. Online-Sessions auf Englisch, Serbisch und Deutsch.
hero:
  label: Heiler · Coach · Kundalini-Yoga-Lehrer
  heading_1: Komm zurück
  heading_2: dir selbst.
  subtitle: Nach außen scheint alles in Ordnung. Aber innerlich fühlt sich etwas festgefahren, müde oder verloren an. Ich helfe dir, das zu lösen, was deine Energie blockiert - damit du in ein wirklich
    lebendiges Leben zurückfindest.
  btn_primary: Session buchen
  btn_ghost: Die Angebote entdecken
pain:
  label: Du bist nicht allein
  heading: Kommt dir
  heading_italic: etwas davon bekannt vor?
  intro_1: Die meisten Menschen, die zu mir finden, haben stabile Jobs, funktionierende Leben und alles, was man ihnen beigebracht hat zu wollen. Und trotzdem fühlt sich etwas nicht richtig an.
  intro_2: Sie haben Therapie ausprobiert. Sie haben die Bücher gelesen. Aber etwas Tieferes hat sich noch nicht verändert.
  quotes:
  - Ich bin ständig müde und überfordert.
  - Ich denke zu viel nach und bekomme meinen Kopf nicht zur Ruhe.
  - Ich fühle mich festgefahren, aber ich weiß nicht warum.
  - In mir fühlt sich etwas blockiert an.
  - Ich fühle mich nicht mehr mit mir selbst verbunden.
  - Ich wiederhole immer wieder dieselben Muster.
  - Ich spüre Gefühle, die einfach nicht verschwinden.
about:
  label: Über mich Nemanja
  heading: Ich habe eine Karriere verlassen, um
  heading_italic: etwas Echtes aufzubauen.
  para_1: Früher habe ich in der IT gearbeitet und Unternehmen dabei begleitet, besser zusammenzuarbeiten. Ich hatte Stabilität, ein gutes Einkommen und einen Weg, der auf dem Papier Sinn ergab. Aber innerlich
    wusste ich, dass da mehr ist.
  para_2: Ich habe all das hinter mir gelassen. Ich bin um die Welt gereist, habe von spirituellen Lehrer*innen gelernt, heilige Orte besucht und Heiltraditionen in verschiedenen Kulturen erforscht. Über
    ein Jahrzehnt hinweg habe ich viele Heilmethoden und Coaching-Ausbildungen absolviert - nicht als Sammlung, sondern aus einer inneren Berufung heraus.
  para_3: Heute habe ich durch Energieheilung, Kundalini Yoga und professionelles Coaching Hunderten von Menschen geholfen, ihre Energie zu öffnen, emotionale Blockaden zu lösen und in ein Leben zurückzufinden,
    das sich wirklich nach ihrem anfühlt.
  para_4: Ich arbeite auf Englisch, Serbisch und Deutsch mit Klient*innen aus Wien und international - komplett online.
  stat_1_num: 10+
  stat_1_label: Jahre Praxis
  stat_2_num: 5+
  stat_2_label: Jahre Unterricht
  stat_3_num: 100s
  stat_3_label: Menschen begleitet
