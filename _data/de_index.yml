testimonials:
  heading: Was Menschen sagen
  heading_italic: nach der Zusammenarbeit
  items:
  - text: I didn't realize how disconnected I've been lately until your class today. Something opened up in me. My body feels softer, my mind clearer, and there's this gentle warmth in my chest that's still
      there. I honestly haven't felt this peaceful in a long time.
    author: Akal-Community-Mitglied
    source: Kundalini-Yoga-Klasse
    featured: true
  - text: 40 days of meditation and Kundalini Yoga did more for me than years of therapy.
    author: Teilnehmer*in des Meditationsprogramms
    source: 40-Tage-Challenge
    featured: false
  - text: Today I felt energy moving for the first time in weeks. My shoulders dropped, my breath relaxed, and my thoughts stopped fighting me.
    author: Klient*in
    source: Nach dem Meditationsabend
    featured: false
  - text: My fear from the marathon is gone. I finished strong. I know I don't need to prove anything to myself. My energy was amazing.
    author: Internationale*r Klient*in
    source: Nach den Inner Shift Sessions
    featured: false
  - text: I am so grateful. I don't know how to say thank you because truly from my heart - you are a real human being.
    author: Klient*in
    source: Nach der Kundalini-Klasse
    featured: false
  - text: Through your sessions my gut feeling has got stronger and it is leading me to the right path. I am getting more intuitive about where I belong and what decisions to make.
    author: Klient*in
    source: Nach fortlaufenden Sessions
    featured: false
  - text: Such lightness in my chest and body after just one session. This is unbelievable.
    author: Bojana K., Belgrade
    source: Nach der ersten Inner Shift Session
    featured: false
  - text: I came in with back pain and a spasm. After the class the discomfort in my lower back was completely gone. I'll see you on Sunday.
    author: Akal-Community-Mitglied
    source: Nach der Kundalini-Yoga-Klasse
    featured: false
  - text: I chose to forgive who hurt me - not because I had to, but because I saw that unkindness doesn't bring me peace. The transformation happened with authenticity, not force.
    author: Klient*in
    source: Nach Yoga- und Meditationssessions
    featured: false
  - text: I had peace I haven't felt in a long time. I hadn't realized how disconnected I had become. Something opened up - and it is still there.
    author: Nina P., Novi Sad
    source: Nach der Inner Shift Session
    featured: false
