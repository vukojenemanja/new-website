<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Tvoj broj duše - Nemanja Vukoje</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --clay:   #C4A882;
  --sand:   #E8DDD0;
  --bark:   #3D2E1E;
  --fog:    #F5F1EC;
  --stone:  #8A8070;
  --deep:   #1E1712;
  --accent: #9B6B3A;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--fog);
  color: var(--bark);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  padding: 28px 40px;
  border-bottom: 1px solid rgba(61,46,30,0.08);
}

header a {
  font-family: 'Cormorant Garamond', serif;
  font-size: 18px;
  font-weight: 400;
  letter-spacing: 1px;
  color: var(--bark);
  text-decoration: none;
}

main {
  flex: 1;
  max-width: 560px;
  margin: 0 auto;
  padding: 80px 24px 100px;
  width: 100%;
}

.eyebrow {
  font-size: 11px;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: var(--stone);
  margin-bottom: 16px;
}

h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(36px, 6vw, 52px);
  font-weight: 300;
  line-height: 1.1;
  margin-bottom: 16px;
}

h1 em { font-style: italic; color: var(--clay); }

.intro {
  font-size: 15px;
  line-height: 1.75;
  color: var(--stone);
  margin-bottom: 48px;
}

/* ── FORM ── */
.form-wrap {
  background: #fff;
  border: 1px solid rgba(61,46,30,0.1);
  padding: 36px 40px;
}

label {
  display: block;
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--stone);
  margin-bottom: 8px;
}

input[type="date"] {
  width: 100%;
  padding: 14px 16px;
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  color: var(--bark);
  background: var(--fog);
  border: 1px solid rgba(61,46,30,0.15);
  outline: none;
  color-scheme: light;
  margin-bottom: 24px;
  appearance: none;
  -webkit-appearance: none;
}

input[type="date"]:focus {
  border-color: var(--clay);
}

.btn {
  display: block;
  width: 100%;
  padding: 16px;
  font-family: 'DM Sans', sans-serif;
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--deep);
  background: var(--clay);
  border: none;
  cursor: pointer;
  transition: background 0.2s;
}

.btn:hover { background: var(--accent); color: #fff; }
.btn:disabled { opacity: 0.5; cursor: default; }

.error {
  font-size: 13px;
  color: #b94a48;
  margin-top: 12px;
  display: none;
}

/* ── RESULT ── */
.result {
  display: none;
  text-align: center;
  padding: 48px 0 0;
}

.soul-number {
  font-family: 'Cormorant Garamond', serif;
  font-size: 96px;
  font-weight: 300;
  line-height: 1;
  color: var(--accent);
  margin-bottom: 8px;
}

.result-label {
  font-size: 11px;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: var(--stone);
  margin-bottom: 32px;
}

.result-text {
  font-size: 15px;
  line-height: 1.75;
  color: var(--stone);
  margin-bottom: 32px;
}

.pdf-btn {
  display: inline-block;
  padding: 16px 36px;
  font-family: 'DM Sans', sans-serif;
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--deep);
  background: var(--clay);
  text-decoration: none;
  transition: background 0.2s;
  margin-bottom: 16px;
}

.pdf-btn:hover { background: var(--accent); color: #fff; }

.reset-link {
  display: block;
  font-size: 12px;
  color: var(--stone);
  text-decoration: none;
  margin-top: 20px;
  cursor: pointer;
}

.reset-link:hover { color: var(--accent); }

@media (max-width: 600px) {
  header { padding: 20px 20px; }
  main { padding: 56px 20px 80px; }
  .form-wrap { padding: 28px 24px; }
}
</style>
</head>
<body>

<header>
  <a href="index.html">Nemanja Vukoje</a>
</header>

<main>
  <div class="eyebrow">Tantrička numerologija</div>
  <h1>Tvoj broj<br><em>duše.</em></h1>
  <p class="intro">Unesi datum rodjenja i odmah saznaj svoj broj duše. Preuzmi besplatno čitanje u PDF formatu.</p>

  <div class="form-wrap">
    <div id="bd-form">
      <label for="bd-dob">Datum rodjenja</label>
      <input type="date" id="bd-dob" autocomplete="bday">
      <button class="btn" id="bd-btn" onclick="calculate()">Otkrij broj duše</button>
      <div class="error" id="bd-error">Izaberi datum rodjenja.</div>
    </div>

    <div class="result" id="bd-result">
      <div class="soul-number" id="bd-number"></div>
      <div class="result-label">Tvoj broj duše</div>
      <p class="result-text">Preuzmi svoje besplatno čitanje:</p>
      <a class="pdf-btn" id="bd-pdf-link" href="#" target="_blank" rel="noopener">Preuzmi PDF</a>
      <br>
      <span class="reset-link" onclick="reset()">← Unesi drugi datum</span>
    </div>
  </div>
</main>

<script>
function calcSoul(dobStr) {
  var s = dobStr.trim();
  var day;
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) {
    day = parseInt(s.split('-')[2], 10);
  } else {
    day = parseInt(s.split('.')[0], 10);
  }
  if (isNaN(day) || day < 1 || day > 31) return null;
  var n = day;
  while (n > 11) {
    var s2 = 0, tmp = n;
    while (tmp > 0) { s2 += tmp % 10; tmp = Math.floor(tmp / 10); }
    n = s2;
  }
  return n;
}

function calculate() {
  var dob = document.getElementById('bd-dob').value;
  var errEl = document.getElementById('bd-error');
  errEl.style.display = 'none';

  var soul = calcSoul(dob);
  if (!soul) {
    errEl.style.display = 'block';
    return;
  }

  document.getElementById('bd-number').textContent = soul;
  document.getElementById('bd-pdf-link').href = 'https://vukojenemanja.com/pdfs/broj-duse/Broj_Duse_' + soul + '.pdf';
  document.getElementById('bd-form').style.display = 'none';
  document.getElementById('bd-result').style.display = 'block';
}

function reset() {
  document.getElementById('bd-dob').value = '';
  document.getElementById('bd-error').style.display = 'none';
  document.getElementById('bd-form').style.display = 'block';
  document.getElementById('bd-result').style.display = 'none';
}

document.getElementById('bd-dob').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') calculate();
});
</script>

</body>
</html>
